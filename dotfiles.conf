# ==========================================================
# dotfiles.conf
# Single source of truth for backup.sh and install.sh.
# Edit this file only — both scripts read it, so you never
# need to update a list in two places again.
# ==========================================================

# Folders under ~/.config to back up / restore.
# (git → covers ~/.config/git/, e.g. global .gitignore, attributes)
# (cmatrix usually has no ~/.config folder of its own — kept here in case
#  yours does; the scripts just skip it harmlessly if not found)
CONFIGS=(
    "hypr"
    "caelestia"
    "kitty"
    "foot"
    "waybar"
    "rofi"
    "fastfetch"
    "fish"
    "git"
    "btop"
    "cmatrix"
    "quickshell"
)

# Individual dotfiles that live directly under $HOME (not ~/.config).
# Stored in the repo under dotfiles/<name>, restored back to $HOME/<name>.
DOTFILES=(
    ".gitconfig"
)

# Folder names under ~/.local/share/fonts to back up / restore.
# Explicit allow-list on purpose — you rarely want every system font
# folder mirrored into the repo.
FONTS=(
    "JetBrainsMono"
)

# Cursor theme folder under ~/.local/share/icons.
CURSOR_NAME="Bibata-Modern-Ice"